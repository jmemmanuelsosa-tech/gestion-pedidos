# ===================== APLICACI\u00c3\u0093N =====================
spring.application.name=gestor-pedidos
server.port=8080

# ===================== BASE DE DATOS (MySQL) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_pedidos?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
# Configuraci\u00f3n local (no se sube a GitHub)
spring.config.import=optional:classpath:application-local.properties

# ===================== JPA / HIBERNATE =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================== SWAGGER =====================
# Documentacion en: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# ===================== IA (Groq, compatible con OpenAI) =====================
# La API key se saca gratis en https://console.groq.com
spring.ai.openai.api-key=${GROQ_API_KEY:sin-configurar}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.chat.options.temperature=0.7
# Solo se usa el chat; desactivamos las otras funciones de IA que no necesitamos
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# ===================== ADMIN INICIAL =====================
app.admin.email=${ADMIN_EMAIL:admin@gestion.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
